<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Segoe UI', Calibri, Arial, sans-serif;">
  <defs>
    <!-- Filter for subtle box shadow -->
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="600" y="42" text-anchor="middle" font-size="20" font-weight="900" fill="#0f2b5c" letter-spacing="1">
    ER DIAGRAM FOR PROPAI REAL ESTATE PLATFORM
  </text>

  <!-- ==================== CONNECTING LINES ==================== -->
  <g stroke="#334155" stroke-width="1.6" fill="none">
    <!-- SELLER to Attributes -->
    <line x1="260" y1="135" x2="195" y2="85" />
    <line x1="260" y1="145" x2="195" y2="125" />
    <line x1="260" y1="160" x2="195" y2="165" />
    <line x1="260" y1="175" x2="195" y2="205" />

    <!-- SELLER to Writes/Lists to PROPERTY -->
    <line x1="410" y1="160" x2="440" y2="160" />
    <line x1="480" y1="160" x2="510" y2="160" />

    <!-- PROPERTY to Attributes Top -->
    <line x1="540" y1="105" x2="455" y2="70" />
    <line x1="570" y1="105" x2="540" y2="70" />
    <line x1="630" y1="105" x2="630" y2="70" />
    <line x1="660" y1="105" x2="720" y2="70" />

    <!-- PROPERTY to Contains to PROPERTY_MEDIA -->
    <line x1="690" y1="160" x2="720" y2="160" />
    <line x1="760" y1="160" x2="790" y2="160" />

    <!-- PROPERTY_MEDIA to Attributes -->
    <line x1="940" y1="135" x2="1005" y2="95" />
    <line x1="940" y1="150" x2="1005" y2="135" />
    <line x1="940" y1="165" x2="1005" y2="175" />
    <line x1="940" y1="180" x2="1005" y2="215" />

    <!-- PROPERTY to Hosts to SITE_VISIT -->
    <line x1="600" y1="260" x2="600" y2="295" />
    <line x1="600" y1="335" x2="600" y2="370" />

    <!-- BUYER to Attributes -->
    <line x1="260" y1="410" x2="195" y2="375" />
    <line x1="260" y1="430" x2="195" y2="415" />
    <line x1="260" y1="450" x2="195" y2="455" />
    <line x1="260" y1="470" x2="195" y2="495" />
    <line x1="260" y1="490" x2="195" y2="535" />

    <!-- BUYER to Books to SITE_VISIT -->
    <line x1="410" y1="445" x2="440" y2="445" />
    <line x1="480" y1="445" x2="510" y2="445" />

    <!-- ADMIN to Attributes -->
    <line x1="940" y1="410" x2="1005" y2="375" />
    <line x1="940" y1="430" x2="1005" y2="415" />
    <line x1="940" y1="450" x2="1005" y2="455" />
    <line x1="940" y1="470" x2="1005" y2="495" />

    <!-- ADMIN to Manages (dashed lines like in reference) -->
    <line x1="790" y1="445" x2="760" y2="445" stroke-dasharray="4,3" />
    <line x1="720" y1="445" x2="690" y2="445" stroke-dasharray="4,3" />
    <line x1="740" y1="425" x2="740" y2="245" stroke-dasharray="4,3" />
    <line x1="740" y1="245" x2="690" y2="245" stroke-dasharray="4,3" />

    <!-- SITE_VISIT to Attributes Bottom -->
    <line x1="540" y1="515" x2="455" y2="560" />
    <line x1="575" y1="515" x2="540" y2="560" />
    <line x1="625" y1="515" x2="630" y2="560" />
    <line x1="660" y1="515" x2="720" y2="560" />

    <!-- SITE_VISIT to Generates to SMART_LOCK_LOG -->
    <line x1="600" y1="515" x2="600" y2="615" />
    <line x1="600" y1="655" x2="600" y2="685" />

    <!-- SMART_LOCK_LOG to Attributes -->
    <line x1="520" y1="730" x2="455" y2="765" />
    <line x1="560" y1="730" x2="540" y2="765" />
    <line x1="640" y1="730" x2="635" y2="765" />
    <line x1="680" y1="730" x2="720" y2="765" />
  </g>

  <!-- ==================== CARDINALITY LABELS ==================== -->
  <g font-size="13" font-weight="bold" fill="#0f172a">
    <!-- SELLER - Lists - PROPERTY -->
    <text x="420" y="152">1</text>
    <text x="498" y="152">N</text>

    <!-- PROPERTY - Contains - MEDIA -->
    <text x="702" y="152">1</text>
    <text x="778" y="152">N</text>

    <!-- PROPERTY - Hosts - SITE_VISIT -->
    <text x="612" y="278">1</text>
    <text x="612" y="360">N</text>

    <!-- BUYER - Books - SITE_VISIT -->
    <text x="420" y="438">1</text>
    <text x="498" y="438">N</text>

    <!-- ADMIN - Manages - SITE_VISIT / PROPERTY -->
    <text x="775" y="438">1</text>
    <text x="702" y="438">N</text>
    <text x="725" y="260">N</text>

    <!-- SITE_VISIT - Generates - SMART_LOCK_LOG -->
    <text x="612" y="598">1</text>
    <text x="612" y="675">N</text>
  </g>

  <!-- ==================== RELATIONSHIP DIAMONDS ==================== -->
  <!-- Lists / Owns -->
  <g transform="translate(460, 160)">
    <polygon points="0,-20 20,0 0,20 -20,0" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8" filter="url(#shadow)"/>
    <text x="0" y="4" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#9a3412">Lists</text>
  </g>

  <!-- Contains -->
  <g transform="translate(740, 160)">
    <polygon points="0,-20 20,0 0,20 -20,0" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8" filter="url(#shadow)"/>
    <text x="0" y="4" text-anchor="middle" font-size="9" font-weight="bold" fill="#9a3412">Contains</text>
  </g>

  <!-- Hosts -->
  <g transform="translate(600, 315)">
    <polygon points="0,-20 20,0 0,20 -20,0" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8" filter="url(#shadow)"/>
    <text x="0" y="4" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#9a3412">Hosts</text>
  </g>

  <!-- Books -->
  <g transform="translate(460, 445)">
    <polygon points="0,-20 20,0 0,20 -20,0" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8" filter="url(#shadow)"/>
    <text x="0" y="4" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#9a3412">Books</text>
  </g>

  <!-- Manages -->
  <g transform="translate(740, 445)">
    <polygon points="0,-20 20,0 0,20 -20,0" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8" filter="url(#shadow)"/>
    <text x="0" y="4" text-anchor="middle" font-size="9" font-weight="bold" fill="#9a3412">Manages</text>
  </g>

  <!-- Generates -->
  <g transform="translate(600, 635)">
    <polygon points="0,-20 22,0 0,20 -22,0" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8" filter="url(#shadow)"/>
    <text x="0" y="4" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#9a3412">Generates</text>
  </g>

  <!-- ==================== ENTITY TABLES ==================== -->

  <!-- 1. SELLER ENTITY (Green Theme) -->
  <g transform="translate(260, 105)" filter="url(#shadow)">
    <rect width="150" height="110" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="1.8"/>
    <rect width="150" height="26" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
    <text x="75" y="18" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532d">SELLER / AGENT</text>
    <g font-size="10" fill="#1f2937">
      <text x="12" y="45" font-weight="bold">Seller_ID <tspan fill="#16a34a">(PK)</tspan></text>
      <text x="12" y="62">Name</text>
      <text x="12" y="79">Email</text>
      <text x="12" y="96">Phone</text>
    </g>
  </g>

  <!-- 2. PROPERTY ENTITY (Blue Theme - Central Entity) -->
  <g transform="translate(510, 105)" filter="url(#shadow)">
    <rect width="180" height="155" rx="3" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <rect width="180" height="26" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="90" y="18" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">PROPERTY</text>
    <g font-size="10" fill="#1f2937">
      <text x="12" y="43" font-weight="bold">Property_ID <tspan fill="#2563eb">(PK)</tspan></text>
      <text x="12" y="59">Title</text>
      <text x="12" y="75">Price</text>
      <text x="12" y="91">City</text>
      <text x="12" y="107">Property_Type</text>
      <text x="12" y="123">Size_Sqft</text>
      <text x="12" y="139" font-weight="bold">Owner_ID <tspan fill="#dc2626">(FK)</tspan></text>
    </g>
  </g>

  <!-- 3. PROPERTY_MEDIA ENTITY (Purple Theme) -->
  <g transform="translate(790, 105)" filter="url(#shadow)">
    <rect width="150" height="110" rx="3" fill="#ffffff" stroke="#9333ea" stroke-width="1.8"/>
    <rect width="150" height="26" rx="3" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.8"/>
    <text x="75" y="18" text-anchor="middle" font-size="12" font-weight="bold" fill="#581c87">PROPERTY_MEDIA</text>
    <g font-size="10" fill="#1f2937">
      <text x="12" y="45" font-weight="bold">Media_ID <tspan fill="#9333ea">(PK)</tspan></text>
      <text x="12" y="62" font-weight="bold">Property_ID <tspan fill="#dc2626">(FK)</tspan></text>
      <text x="12" y="79">Media_Url</text>
      <text x="12" y="96">Type (360/Image)</text>
    </g>
  </g>

  <!-- 4. BUYER ENTITY (Amber/Orange Theme) -->
  <g transform="translate(260, 390)" filter="url(#shadow)">
    <rect width="150" height="125" rx="3" fill="#ffffff" stroke="#ea580c" stroke-width="1.8"/>
    <rect width="150" height="26" rx="3" fill="#ffedd5" stroke="#ea580c" stroke-width="1.8"/>
    <text x="75" y="18" text-anchor="middle" font-size="12" font-weight="bold" fill="#7c2d12">BUYER</text>
    <g font-size="10" fill="#1f2937">
      <text x="12" y="45" font-weight="bold">Buyer_ID <tspan fill="#ea580c">(PK)</tspan></text>
      <text x="12" y="62">Name</text>
      <text x="12" y="79">Email</text>
      <text x="12" y="96">Phone</text>
      <text x="12" y="113">Verified_Status</text>
    </g>
  </g>

  <!-- 5. SITE_VISIT ENTITY (Red Theme) -->
  <g transform="translate(510, 370)" filter="url(#shadow)">
    <rect width="180" height="145" rx="3" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
    <rect width="180" height="26" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="90" y="18" text-anchor="middle" font-size="13" font-weight="bold" fill="#7f1d1d">SITE_VISIT</text>
    <g font-size="10" fill="#1f2937">
      <text x="12" y="43" font-weight="bold">Visit_ID <tspan fill="#dc2626">(PK)</tspan></text>
      <text x="12" y="59" font-weight="bold">Property_ID <tspan fill="#2563eb">(FK)</tspan></text>
      <text x="12" y="75" font-weight="bold">Buyer_ID <tspan fill="#ea580c">(FK)</tspan></text>
      <text x="12" y="91">Visit_Date</text>
      <text x="12" y="107">Visit_Time</text>
      <text x="12" y="123">PIN_Code (IoT)</text>
      <text x="12" y="139">Status</text>
    </g>
  </g>

  <!-- 6. ADMIN ENTITY (Slate/Grey Theme) -->
  <g transform="translate(790, 390)" filter="url(#shadow)">
    <rect width="150" height="110" rx="3" fill="#ffffff" stroke="#475569" stroke-width="1.8"/>
    <rect width="150" height="26" rx="3" fill="#f1f5f9" stroke="#475569" stroke-width="1.8"/>
    <text x="75" y="18" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">ADMIN</text>
    <g font-size="10" fill="#1f2937">
      <text x="12" y="45" font-weight="bold">Admin_ID <tspan fill="#475569">(PK)</tspan></text>
      <text x="12" y="62">Name</text>
      <text x="12" y="79">Email</text>
      <text x="12" y="96">Role</text>
    </g>
  </g>

  <!-- 7. SMART_LOCK_LOG ENTITY (Teal Theme) -->
  <g transform="translate(510, 655)" filter="url(#shadow)">
    <rect width="180" height="100" rx="3" fill="#ffffff" stroke="#0d9488" stroke-width="1.8"/>
    <rect width="180" height="24" rx="3" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.8"/>
    <text x="90" y="17" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#115e59">SMART_LOCK_LOG</text>
    <g font-size="10" fill="#1f2937">
      <text x="12" y="42" font-weight="bold">Log_ID <tspan fill="#0d9488">(PK)</tspan></text>
      <text x="12" y="58" font-weight="bold">Visit_ID <tspan fill="#dc2626">(FK)</tspan></text>
      <text x="12" y="74">Event_Type</text>
      <text x="12" y="90">Timestamp</text>
    </g>
  </g>

  <!-- ==================== ATTRIBUTE OVALS ==================== -->
  <g fill="#f8fafc" stroke="#64748b" stroke-width="1.4" font-size="10" text-anchor="middle">
    <!-- SELLER Ovals (Left) -->
    <ellipse cx="140" cy="85" rx="55" ry="14" />
    <text x="140" y="89" font-weight="bold" text-decoration="underline"><u>Seller_ID</u></text>

    <ellipse cx="140" cy="125" rx="55" ry="14" />
    <text x="140" y="129">Name</text>

    <ellipse cx="140" cy="165" rx="55" ry="14" />
    <text x="140" y="169">Email</text>

    <ellipse cx="140" cy="205" rx="55" ry="14" />
    <text x="140" y="209">Phone</text>

    <!-- PROPERTY Ovals (Top) -->
    <ellipse cx="455" cy="65" rx="52" ry="14" />
    <text x="455" y="69" font-weight="bold" text-decoration="underline"><u>Property_ID</u></text>

    <ellipse cx="540" cy="65" rx="38" ry="14" />
    <text x="540" y="69">Title</text>

    <ellipse cx="630" cy="65" rx="38" ry="14" />
    <text x="630" y="69">Price</text>

    <ellipse cx="720" cy="65" rx="42" ry="14" />
    <text x="720" y="69">City</text>

    <!-- MEDIA Ovals (Right Top) -->
    <ellipse cx="1060" cy="95" rx="55" ry="14" />
    <text x="1060" y="99" font-weight="bold" text-decoration="underline"><u>Media_ID</u></text>

    <ellipse cx="1060" cy="135" rx="55" ry="14" />
    <text x="1060" y="139">Media_Url</text>

    <ellipse cx="1060" cy="175" rx="55" ry="14" />
    <text x="1060" y="179">Type</text>

    <ellipse cx="1060" cy="215" rx="55" ry="14" />
    <text x="1060" y="219">Caption</text>

    <!-- BUYER Ovals (Left Middle) -->
    <ellipse cx="140" cy="375" rx="55" ry="14" />
    <text x="140" y="379" font-weight="bold" text-decoration="underline"><u>Buyer_ID</u></text>

    <ellipse cx="140" cy="415" rx="55" ry="14" />
    <text x="140" y="419">Name</text>

    <ellipse cx="140" cy="455" rx="55" ry="14" />
    <text x="140" y="459">Email</text>

    <ellipse cx="140" cy="495" rx="55" ry="14" />
    <text x="140" y="499">Phone</text>

    <ellipse cx="140" cy="535" rx="55" ry="14" />
    <text x="140" y="539">Verified_Status</text>

    <!-- ADMIN Ovals (Right Middle) -->
    <ellipse cx="1060" cy="375" rx="55" ry="14" />
    <text x="1060" y="379" font-weight="bold" text-decoration="underline"><u>Admin_ID</u></text>

    <ellipse cx="1060" cy="415" rx="55" ry="14" />
    <text x="1060" y="419">Name</text>

    <ellipse cx="1060" cy="455" rx="55" ry="14" />
    <text x="1060" y="459">Email</text>

    <ellipse cx="1060" cy="495" rx="55" ry="14" />
    <text x="1060" y="499">Role</text>

    <!-- SITE_VISIT Ovals (Middle Bottom) -->
    <ellipse cx="455" cy="565" rx="48" ry="14" />
    <text x="455" y="569" font-weight="bold" text-decoration="underline"><u>Visit_ID</u></text>

    <ellipse cx="540" cy="565" rx="42" ry="14" />
    <text x="540" y="569">Visit_Date</text>

    <ellipse cx="630" cy="565" rx="42" ry="14" />
    <text x="630" y="569">PIN_Code</text>

    <ellipse cx="720" cy="565" rx="38" ry="14" />
    <text x="720" y="569">Status</text>

    <!-- SMART_LOCK_LOG Ovals (Bottom) -->
    <ellipse cx="455" cy="770" rx="46" ry="14" />
    <text x="455" y="774" font-weight="bold" text-decoration="underline"><u>Log_ID</u></text>

    <ellipse cx="540" cy="770" rx="44" ry="14" />
    <text x="540" y="774">Event_Type</text>

    <ellipse cx="630" cy="770" rx="42" ry="14" />
    <text x="630" y="774">Actor</text>

    <ellipse cx="720" cy="770" rx="44" ry="14" />
    <text x="720" y="774">Timestamp</text>
  </g>

  <!-- ==================== LEGEND (ER NOTATION) ==================== -->
  <g transform="translate(180, 830)">
    <rect width="840" height="42" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4" filter="url(#shadow)"/>
    <text x="80" y="25" text-anchor="middle" font-size="10.5" font-weight="900" fill="#0f172a" letter-spacing="0.5">
      LEGEND<tspan fill="#64748b" font-weight="normal"> (ER NOTATION)</tspan>
    </text>

    <!-- Entity Legend -->
    <rect x="170" y="14" width="28" height="15" fill="#ffffff" stroke="#16a34a" stroke-width="1.6"/>
    <text x="215" y="25" font-size="10" font-weight="bold" fill="#334155">Entity</text>

    <!-- Attribute Legend -->
    <ellipse cx="280" cy="21" rx="16" ry="9" fill="#f8fafc" stroke="#64748b" stroke-width="1.4"/>
    <text x="315" y="25" font-size="10" font-weight="bold" fill="#334155">Attribute</text>

    <!-- Relationship Legend -->
    <polygon points="380,13 390,21 380,29 370,21" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6"/>
    <text x="425" y="25" font-size="10" font-weight="bold" fill="#334155">Relationship</text>

    <!-- PK -->
    <text x="495" y="25" font-size="10" font-weight="900" fill="#2563eb">PK</text>
    <text x="545" y="25" font-size="10" font-weight="bold" fill="#334155">Primary Key</text>

    <!-- FK -->
    <text x="605" y="25" font-size="10" font-weight="900" fill="#dc2626">FK</text>
    <text x="655" y="25" font-size="10" font-weight="bold" fill="#334155">Foreign Key</text>

    <!-- Cardinality 1 -->
    <text x="715" y="25" font-size="11" font-weight="900" fill="#0f172a">1</text>
    <text x="740" y="25" font-size="10" font-weight="bold" fill="#334155">One</text>

    <!-- Cardinality N -->
    <text x="775" y="25" font-size="11" font-weight="900" fill="#0f172a">N</text>
    <text x="800" y="25" font-size="10" font-weight="bold" fill="#334155">Many</text>
  </g>
</svg>
